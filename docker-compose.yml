name: stckcraw

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-1800}"
    command: ["-dashboard", "-out", "/data", "-limit", "10"]
    volumes:
      - dashboard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/latest.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - dashboard-data:/usr/share/nginx/html/data:ro
    depends_on:
      dashboard:
        condition: service_started
    restart: unless-stopped

volumes:
  dashboard-data:
