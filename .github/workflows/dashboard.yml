name: dashboard

on:
  push:
    branches:
      - main
      - master
  schedule:
    # GitHub Actions cron is UTC. Brazil is UTC-3 year-round (no DST).
    # 11:05-19:35 UTC = 08:05-16:35 BRT; 20:05 UTC = 17:05 BRT.
    # Minutes 5/35 avoid the top-of-the-hour load window where GitHub may drop runs.
    - cron: "5,35 11-19 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build dashboard snapshot
        run: go run ./cmd/stckcraw -dashboard -out docs/data -limit 10

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
