# Script Worker (cron dispatcher), not a static-assets Worker.
# Do not add an [assets] section here: the site is served by GitHub Pages.
name = "stckcraw-dispatch"
main = "src/index.js"
compatibility_date = "2026-10-29"

[vars]
GITHUB_OWNER = "fabianoflorentino"
GITHUB_REPO = "stckcraw"
GITHUB_WORKFLOW = "dashboard.yml"
GITHUB_REF = "main"

[triggers]
# Cloudflare cron is UTC (B3 time is America/Sao_Paulo, UTC-3).
# 13:05-20:35 UTC = 10:05-17:35 BRT.
# The extra 21:05 UTC run = 18:05 BRT (after-market close).
# Cloudflare weekdays: 1=Sunday ... 7=Saturday. Use 2-6 for Monday-Friday.
crons = [
  "5,35 13-20 * * 2-6",
  "5 21 * * 2-6",
]

[observability]
enabled = true

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
# ...
